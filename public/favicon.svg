<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 1024 1024">
  
  <defs>
    <radialGradient id="bg" cx="50%" cy="28%" r="85%">
      <stop offset="0%" stop-color="#FCDCC3"/>
      <stop offset="100%" stop-color="#E68266"/>
    </radialGradient>
    <linearGradient id="mug" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#5CC2B3"/>
      <stop offset="60%" stop-color="#3FA99B"/>
      <stop offset="100%" stop-color="#2A7D72"/>
    </linearGradient>
    <linearGradient id="wood" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#EBC39C"/>
      <stop offset="100%" stop-color="#D49A6A"/>
    </linearGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
  </defs>
  <rect width="1024" height="1024" rx="230" fill="url(#bg)"/>
  
  <g transform="translate(512 512) scale(1) translate(-512 -512)">
    <!-- rafa düşen yumuşak gölge -->
