    <path d="M 640 470 C 742 470 742 640 640 640" fill="none" stroke="#3FA99B" stroke-width="30" stroke-linecap="round"/>
    <!-- fincan gövdesi -->
    <path d="M 316 404 L 708 404 L 686 640 Q 680 712 606 712 L 418 712 Q 344 712 338 640 Z" fill="url(#mug)"/>
    <!-- ağız kenarı (krem) -->
    <rect x="300" y="382" width="424" height="52" rx="26" fill="#FFF6EC"/>
    <rect x="322" y="398" width="380" height="18" rx="9" fill="#2A7D72" opacity="0.35"/>
