    <rect x="252" y="714" width="520" height="8" rx="4" fill="#FFFFFF" opacity="0.4"/>
    <rect x="232" y="738" width="560" height="14" rx="7" fill="#A86E45" opacity="0.55"/>
    <!-- fincan kulbu -->
