    <!-- buhar -->
    <path d="M 450 344 C 410 300 490 270 450 220" fill="none" stroke="#FFF6EC" stroke-width="22" stroke-linecap="round" opacity="0.92"/>
    <path d="M 574 344 C 534 296 614 262 574 206" fill="none" stroke="#FFF6EC" stroke-width="22" stroke-linecap="round" opacity="0.92"/>
