# GitHub Pages yayını: main'e her push'ta oyunu https://mehmet-yuksell.github.io/ilk_oyun/ adresine kurar.
# Vercel'den bağımsızdır (Vercel kendi ayarlarıyla kökten '/' yayınlamaya devam eder) -- *.vercel.app
# Türkiye'deki bazı sağlayıcılarda açılmadığı için yedek adres. Pages alt klasörde yayınladığı için
# build'e --base=/ilk_oyun/ verilir; vite.config.ts değişmez.
name: GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx tsc && npx vite build --base=/ilk_oyun/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
